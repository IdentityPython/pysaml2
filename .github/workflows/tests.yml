name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Python ${{ matrix.python }}, xmlschema ${{ matrix.xmlschema }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        xmlschema: ["2", "3", "4"]
        include:
          # xmlschema < 4 depends on elementpath < 5, which fails on Python 3.15.
          - python: "3.15"
            xmlschema: "4"
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: sudo apt-get update && sudo apt-get install -y xmlsec1
      - run: python -m pip install poetry tox
      - run: tox -e "py${PYTHON//./}-xmlschema${XMLSCHEMA}"
        env:
          PYTHON: ${{ matrix.python }}
          XMLSCHEMA: ${{ matrix.xmlschema }}
